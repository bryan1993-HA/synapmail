name: Bug Report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Paste any relevant screenshots, browser console errors, or Docker logs here.
      render: shell

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker Compose (recommended)
        - Docker only
        - Manual (Node.js)
        - ghcr.io image
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Synapmail version
      description: Check the GitHub release tag or the image tag you are running.
      placeholder: "e.g. v1.2.0"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, reverse proxy, anything relevant.
      placeholder: "Ubuntu 24.04, nginx reverse proxy, PostgreSQL 16"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am running the latest available version
          required: true
